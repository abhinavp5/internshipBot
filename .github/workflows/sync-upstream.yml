name: Sync fork from upstream (same branch names)

on:
  schedule:
    - cron: "*/20 * * * *" # every 20 minutes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Check if upstream has changes
        id: check-for-upstream-changes
        run: |
          # Add upstream remote
          git remote get-url upstream >/dev/null 2>&1 && \
            git remote set-url upstream https://github.com/SimplifyJobs/Summer2026-Internships.git || \
            git remote add upstream https://github.com/SimplifyJobs/Summer2026-Internships.git
          
          git fetch upstream
          
          HAS_CHANGES=false
          for branch in $(git for-each-ref --format='%(refname:short)' refs/remotes/upstream/ | sed 's#^upstream/##' | grep -v '^HEAD$'); do
            if git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
              if ! git diff --quiet "origin/$branch" "upstream/$branch" 2>/dev/null; then
                echo "Changes detected in branch: $branch"
                HAS_CHANGES=true
                break
              fi
            else
              echo "New branch detected: $branch" 
              HAS_CHANGES=true
              break
            fi
          done
          
          if [ "$HAS_CHANGES" = "false" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "No changes detected in any upstream branches"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "Changes detected, proceeding with sync"
          fi          


      - name: Add upstream and fetch
        if: steps.check-for-upstream-changes.outputs.skip != 'true'
        run: |
          git fetch --prune upstream
          git fetch --prune origin

      - name: Sync all matching branches from upstream to origin
        if: steps.check-for-upstream-changes.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail

          # Get list of upstream branches (excluding HEAD and invalid names)
          mapfile -t UPSTREAM_BRANCHES < <(git for-each-ref --format='%(refname:short)' refs/remotes/upstream/ | sed 's#^upstream/##' | grep -v '^HEAD$' | grep -v '^upstream$' | grep -v '^origin$' | sort -u)

          echo "Found upstream branches: ${UPSTREAM_BRANCHES[*]:-<none>}"

          # Prepare output directory
          mkdir -p changes

          for BRANCH in "${UPSTREAM_BRANCHES[@]}"; do
            echo "\n=== Syncing branch: ${BRANCH} ==="

            # Skip invalid branch names
            if [[ "$BRANCH" =~ ^(upstream|origin|HEAD|refs) ]]; then
              echo "Skipping invalid branch name: ${BRANCH}"
              continue
            fi

            # Ensure we have a local branch tracking origin/BRANCH, or create it
            if git show-ref --verify --quiet "refs/heads/${BRANCH}"; then
              git checkout "${BRANCH}"
            elif git show-ref --verify --quiet "refs/remotes/origin/${BRANCH}"; then
              git checkout -b "${BRANCH}" --track "origin/${BRANCH}"
            else
              # Create branch from upstream if it doesn't exist on origin yet
              # Verify the upstream branch exists before creating
              if git show-ref --verify --quiet "refs/remotes/upstream/${BRANCH}"; then
                git checkout -b "${BRANCH}" "upstream/${BRANCH}"
              else
                echo "Warning: upstream/${BRANCH} not found, skipping"
                continue
              fi
            fi

            BEFORE_SHA=$(git rev-parse HEAD)

            # Attempt fast-forward first; if not possible, do a merge commit
            if git merge --ff-only "upstream/${BRANCH}"; then
              echo "Fast-forwarded ${BRANCH}"
            else
              echo "Fast-forward not possible for ${BRANCH}; performing a merge commit"
              git merge --no-edit "upstream/${BRANCH}"
            fi

            AFTER_SHA=$(git rev-parse HEAD)

            # Record commit list and file changes introduced by the sync on this branch
            git log --oneline "${BEFORE_SHA}..${AFTER_SHA}" > "changes/commits-${BRANCH}.txt" || true
            git diff --name-status "${BEFORE_SHA}..${AFTER_SHA}" > "changes/files-${BRANCH}.txt" || true
            git diff "${BEFORE_SHA}..${AFTER_SHA}" > "changes/patch-${BRANCH}.patch" || true

            # Push to origin using the token
            git push "https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git" "${BRANCH}"
          done

          echo "\nAll branches processed."

      - name: Upload change artifacts
        if: steps.check-for-upstream-changes.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: upstream-sync-changes
          path: changes/

      - name: Append summary
        if: steps.check-for-upstream-changes.outputs.skip != 'true'
        shell: bash
        run: |
          echo "### Upstream sync changes" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          for file in changes/commits-*.txt; do
            [ -f "$file" ] || continue
            BRANCH=${file#changes/commits-}
            BRANCH=${BRANCH%.txt}
            echo "**Branch:** ${BRANCH}" >> "$GITHUB_STEP_SUMMARY"
            echo "Commits introduced:" >> "$GITHUB_STEP_SUMMARY"
            sed -n '1,100p' "$file" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Files changed:" >> "$GITHUB_STEP_SUMMARY"
            sed -n '1,200p' "changes/files-${BRANCH}.txt" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Extract new internship lines from README changes
        if: steps.check-for-upstream-changes.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p email
          > email/body.txt

          for patch in changes/patch-*.patch; do
            [ -f "$patch" ] || continue
            BRANCH=${patch#changes/patch-}
            BRANCH=${BRANCH%.patch}

            # Extract added lines (+) in README files only, ignore table separators and images
            ADDED=$(awk '/^\+\+\+ /{infile=$2} /^\+/{ if (infile ~ /README(.*)?\.md$/ && $0 !~ /^\+\+\+/) print }' "$patch" | sed 's/^+//' | grep -E "\S" | grep -vE '^\|\s*-+|^!\[|^<img' || true)

            if [ -n "$ADDED" ]; then
              {
                echo "Branch: $BRANCH"
                echo "New internship lines:"
                echo "$ADDED"
                echo ""
              } >> email/body.txt
            fi
          done

          if [ ! -s email/body.txt ]; then
            echo "No new internship lines detected." > email/body.txt
          fi

      - name: Upload email body artifact
        if: steps.check-for-upstream-changes.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: email-body
          path: email/body.txt

      - name: Check if there are new lines
        if: steps.check-for-upstream-changes.outputs.skip != 'true'
        id: newlines
        shell: bash
        run: |
          if grep -qEv '^\s*$|^No new internship lines detected\.$' email/body.txt; then
            echo "has_new=true" >> $GITHUB_OUTPUT
          else
            echo "has_new=false" >> $GITHUB_OUTPUT
          fi

      - name: Load email body into env
        if: steps.check-for-upstream-changes.outputs.skip != 'true'
        shell: bash
        run: |
          EMAIL_BODY="$(cat email/body.txt)"
          {
            echo "EMAIL_BODY<<EOF"
            echo "$EMAIL_BODY"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Send email with changes (SMTP)
        if: steps.check-for-upstream-changes.outputs.skip != 'true' && steps.newlines.outputs.has_new == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }} # Emailing myself so using same email and pass
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: New Internship Posted
          to: ${{ secrets.MAIL_USERNAME }}
          from: ${{ secrets.MAIL_USERNAME }}
          ignore_cert: true
          convert_markdown: false
          body: ${{ env.EMAIL_BODY }}

      - name: Print email body (for logs)
        if: always() && steps.check-for-upstream-changes.outputs.skip != 'true'
        shell: bash
        run: |
          echo "Email body:" && cat email/body.txt

      - name: Skip message
        if: steps.check-for-upstream-changes.outputs.skip == 'true'
        run: |
          echo "No upstream changes detected. Skipping sync workflow."
